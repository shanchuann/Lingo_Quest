server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

spring:
  application:
    name: lingo-quest-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:lingo_quest}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:lingoquest123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:mapper/**/*.xml

# === Application config ===
app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes-please}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
    refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-ms: 30000
  ai:
    cache-ttl-hours: 24
    rate-limit-per-minute: 10
  # Redis is optional: with REDIS_ENABLED=false the AI cache / rate limiter /
  # weekly leaderboard fall back to in-process implementations (single instance).
  redis:
    enabled: ${REDIS_ENABLED:true}
  # Origin patterns allowed by the backend. The Vercel /api rewrite forwards the
  # browser Origin header, so Vercel deployments must be listed. Comma separated;
  # override with CORS_ALLOWED_ORIGINS (e.g. add your custom domain).
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}"

# === API Docs ===
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.lingoquest: DEBUG
    org.springframework.security: INFO
